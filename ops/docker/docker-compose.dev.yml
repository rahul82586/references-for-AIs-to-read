version: '3.8'

services:
  # PostgreSQL - Primary Transactional Database
  postgres:
    image: postgres:15-alpine
    container_name: broker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: broker_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - broker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Event Bus
  redis:
    image: redis:7-alpine
    container_name: broker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - broker_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse - Time-Series Analytics (Optional)
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: broker_clickhouse
    environment:
      CLICKHOUSE_DB: broker_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./ops/docker/clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - broker_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka - Event Streaming (Optional for high-scale)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker_kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - broker_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: broker_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - broker_network

  # Adminer - Database GUI (Development Only)
  adminer:
    image: adminer:latest
    container_name: broker_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - broker_network

networks:
  broker_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
