[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "broker-platform"
version = "0.1.0"
description = "Tier-1 Institutional Brokerage Platform with MT5-style core and AI-driven intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # ... existing dependencies ...
    "psutil>=5.9.0",  # For memory usage statistics,

    # Core Framework
    "dependency-injector>=4.41.0",
    
    # Web & API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    
    # Database & ORM
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.1",
    "clickhouse-driver>=0.2.6",
    
    # Messaging & Events
    "kafka-python>=2.0.2",
    
    # Market Data (M10: trade-server WS feed frames are msgpack-encoded)
    "msgpack>=1.0.7",
    
    # Security
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Data & Analytics
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "pydantic>=2.5.3",
    
    # CLI
    "typer>=0.9.0",
    "rich>=13.7.0",
    
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "locust>=2.20.0",
    
    # Utilities
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
# M10: real A-Book LP connectivity over quickfixn (native build; not needed
# for the simulated LP - BROKER_FIX_SIMULATOR=1).
fix = [
    "quickfix>=1.6.4",
]
dev = [
    "black>=24.1.0",
    "ruff>=0.1.14",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
broker = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["broker-platform.*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
