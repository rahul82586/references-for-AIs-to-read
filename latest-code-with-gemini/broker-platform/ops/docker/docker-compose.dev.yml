# ============================================================================
# LOCAL DEVELOPMENT datastore stack (M5 cleanup).
#
# Kafka + Zookeeper were deleted: nothing in the codebase references them and
# settings.yaml doesn't configure them — dead weight that made `make docker-up`
# slow and misleading. The event bus is Redis (REDIS_URL) or in-process.
#
# ClickHouse is behind the `analytics` profile: the cold path is deferred, and
# a 1 GB image should not download for `make docker-up`.
#
# If you run against managed services (Neon/Upstash/ElastiCache...) you do not
# need this file at all — put the URLs in .env and start the app
# (ops/docker/docker-compose.yml). The clickhouse_init.sql mount path was also
# fixed: compose resolves relative paths from THIS file's directory, so the old
# ./ops/docker/clickhouse_init.sql pointed at a directory that cannot exist.
# ============================================================================

services:
  # PostgreSQL - primary transactional database
  postgres:
    image: postgres:15-alpine
    container_name: broker_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: broker_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - broker_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - cache & distributed event bus
  redis:
    image: redis:7-alpine
    container_name: broker_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - broker_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - database GUI (development only)
  adminer:
    image: adminer:latest
    container_name: broker_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - broker_network

  # ClickHouse - time-series analytics (deferred cold path; opt-in)
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    profiles: ["analytics"]
    container_name: broker_clickhouse
    environment:
      CLICKHOUSE_DB: broker_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - broker_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  broker_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
