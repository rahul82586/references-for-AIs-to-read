crypto:
  BTCUSD:
    name: BTCUSD
    path: "Crypto-Currency\\Crypto Majors\\BTCUSD"
    description: "Bitcoin vs US Dollar"
    base_currency: BTC
    quote_currency: USD
    digits: 0
    tick_size: 1                  # MT5 Point 1.00000000 for a 0-digit symbol
    tick_value: 0
    contract_size: 1              # 1 BTC, not 100000
    calc_mode: FOREX_NO_LEVERAGE  # MT5 CalcMode 5. The old enum would have read this
                                  # as STOCKS, which is why the enums were corrected.
    trade_mode: FULL
    exec_mode: MARKET
    fill_flags: IOC
    order_flags: 127
    volume_min: 0.01
    volume_max: 1000              # MT5 VolumeMax "10000000"
    volume_step: 0.01
    swap_mode: POINTS
    swap_long: -27734.36
    swap_short: -27734.36
    swap_3day: 5
    margin_rates:
      initial_buy: 0.1
      initial_sell: 0.1
      maintenance_buy: 0.1
      maintenance_sell: 0.1
    # Crypto trades 24/7 on this server: all seven days open, including the weekend.
    trade_sessions:
      Sunday:    [{open: 0, close: 1440}]
      Monday:    [{open: 0, close: 1440}]
      Tuesday:   [{open: 0, close: 1440}]
      Wednesday: [{open: 0, close: 1440}]
      Thursday:  [{open: 0, close: 1440}]
      Friday:    [{open: 0, close: 1440}]
      Saturday:  [{open: 0, close: 1440}]
    is_trade_allowed: true
